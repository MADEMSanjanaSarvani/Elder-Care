name: caregiver_app
description: >
  Project Setu — Caregiver app. A work queue, not a brand showcase (PRD
  Part 3 §17): job list, OTP visit verification, earnings.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  setu_core:
    path: ../../packages/setu_core
  supabase_flutter: ^2.5.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
