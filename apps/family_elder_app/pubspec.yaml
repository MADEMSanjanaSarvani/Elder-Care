name: family_elder_app
description: >
  CareHive — the medicine record. One codebase, two experience modes: family
  mode (dashboard, today's doses, consent management) and elder mode
  (large-text, today's doses with SOS pinned to the bottom).
publish_to: "none"
version: 0.8.3+64

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  setu_core:
    path: ../../packages/setu_core
  supabase_flutter: ^2.5.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  intl: ^0.20.2
  geolocator: ^13.0.1
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  file_picker: ^8.1.2
  # Charts / data-visualisation (pure Dart — no native code, safe for the
  # Android build). Powers the health trends, activity bars and adherence
  # graphs across the dashboard, wellness and reports screens.
  fl_chart: ^0.69.0
  # Offline detection for the global "no internet" banner + graceful retries.
  connectivity_plus: ^6.0.5
  # Medical ID QR (pure Dart, depends only on `qr` — no native code). The code
  # carries the emergency details themselves rather than a link, so it scans
  # with no network at all; see medical_id_screen.dart.
  qr_flutter: ^4.1.0
  # Exact, on-device dose reminders. Server push cannot be the reminder: a
  # GitHub Actions cron is best-effort and was observed drifting 90+ minutes,
  # and FCM needs a data connection. An alarm scheduled on the phone fires on
  # time, offline, and carries the "Taken" button. See core/local_reminders.dart.
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  # Push notifications (FCM) and Google Sign-In. Bounded below the next major
  # so a CI resolve never silently pulls a breaking API change.
  firebase_core: ">=3.6.0 <4.0.0"
  firebase_messaging: ">=15.1.0 <16.0.0"
  google_sign_in: ">=6.2.0 <7.0.0"
  # Video consultations (Agora) + runtime camera/mic permissions.
  # Pinned to 6.3.2: later 6.5.x ship split native AARs (iris-rtc +
  # agora-special-full) that declare the same io.agora.rtc namespace, which
  # AGP 9's manifest merger rejects ("namespace used in multiple modules").
  agora_rtc_engine: "6.3.2"
  permission_handler: ">=11.3.0 <12.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# CareHive launcher icon. Regenerate after
# changing the source art with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F5EDDF"
  adaptive_icon_foreground: "assets/icon/foreground.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    # Original CareHive illustrations (tools/build_illustrations.py regenerates
    # them). The 2.0x/ variants are picked up automatically by Flutter.
    - assets/illustrations/

  # Plus Jakarta Sans — the typeface every CareHive design is drawn in. Bundled
  # rather than fetched at runtime: an elder-care app has to look right on a
  # bad connection, and google_fonts downloads on first paint. It is a variable
  # font, so one 176 KB file covers every weight from 200 to 800 and the whole
  # app gets real 600/700/800 weights instead of Roboto faux-bolding.
  #
  # SIL Open Font License 1.1 — assets/fonts/OFL.txt ships alongside it, which
  # is what the licence requires.
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
