name: family_elder_app
description: >
  Project Setu — Family & Elder app. One codebase, two experience modes
  (PRD Part 3 §17/§18): family mode (dashboard, booking, consent
  management) and elder mode (large-text, voice-first, three-action home).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  setu_core:
    path: ../../packages/setu_core
  supabase_flutter: ^2.5.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  intl: ^0.20.2
  geolocator: ^13.0.1
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# Setu brand launcher icon (bridge + heart on terracotta). Regenerate after
# changing the source art with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#5E9E7C"
  adaptive_icon_foreground: "assets/icon/foreground.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/icon.png
