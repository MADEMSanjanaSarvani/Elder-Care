# Runs the medicine pipeline on a schedule.
#
# Nothing did. Two functions, both deployed, both never called:
#
#   medications-generate-doses  turns each active medicine's schedule into
#                               dated dose rows, and enqueues a reminder for
#                               each new one
#   reminders-dispatch-sweep    finds reminders that have come due, writes the
#                               notification row and sends the push
#
# Without the first there are no doses to remind about; without the second the
# reminders sit in the table forever. Together with the missing FCM send, that
# was three broken links in a four-link chain, each one invisible because the
# link before it never produced anything.
#
# Order matters: generate first, dispatch second, so a medicine added a moment
# ago can still be reminded about in this same run.
#
# Neither function uses Supabase API-key auth — both are verify_jwt = false and
# check their own `x-…-secret` header instead. That is why no service_role key
# appears here: a key that bypasses every RLS policy in the database has no
# business sitting in a CI secret when a purpose-made shared secret does the job
# and can be rotated without touching anything else.
#
# Every 15 minutes. Dose times land on quarter hours in practice, and both
# functions are idempotent — generate-doses upserts on a unique
# (medication_id, scheduled_at) and only enqueues reminders for genuinely new
# rows; the dispatcher flips `status` to 'sent'. So a delayed, doubled or
# overlapping run cannot double-send.
name: Medicine sweep

on:
  schedule:
    - cron: "*/15 * * * *"
  # So it can be run by hand while testing, without waiting a quarter hour.
  workflow_dispatch:

concurrency:
  group: medicine-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Generate doses, then dispatch what is due
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          MEDICATIONS_SECRET: ${{ secrets.MEDICATIONS_SWEEP_SHARED_SECRET }}
          REMINDERS_SECRET: ${{ secrets.REMINDERS_SWEEP_SHARED_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${PROJECT_REF:-}" ]; then
            echo "SUPABASE_PROJECT_REF is not set — nothing to do."
            exit 0
          fi

          base="https://${PROJECT_REF}.supabase.co/functions/v1"

          # -f so a non-2xx fails the step. Without it this workflow would
          # report success while delivering nothing, which is precisely the
          # failure it exists to prevent.
          if [ -n "${MEDICATIONS_SECRET:-}" ]; then
            echo "→ medications-generate-doses"
            curl -sS -f -X POST "$base/medications-generate-doses" \
              -H "x-medications-sweep-secret: ${MEDICATIONS_SECRET}" \
              -H "Content-Type: application/json" -d '{}'
            echo
          else
            echo "MEDICATIONS_SWEEP_SHARED_SECRET not set — skipping dose generation."
          fi

          if [ -n "${REMINDERS_SECRET:-}" ]; then
            echo "→ reminders-dispatch-sweep"
            curl -sS -f -X POST "$base/reminders-dispatch-sweep" \
              -H "x-reminders-sweep-secret: ${REMINDERS_SECRET}" \
              -H "Content-Type: application/json" -d '{}'
            echo
          else
            echo "REMINDERS_SWEEP_SHARED_SECRET not set — skipping dispatch."
          fi
