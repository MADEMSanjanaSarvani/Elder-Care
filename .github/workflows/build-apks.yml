name: Build APK

# Builds an installable Android APK for the single Setu app and uploads it as
# a downloadable artifact. Run it manually from the GitHub "Actions" tab
# (Build APK -> Run workflow) whenever you want a fresh APK to share.
#
# One app, three roles: at login the user picks family member / senior /
# caregiver, and the app shows the matching home. (The old separate caregiver
# app is superseded and no longer built.)
#
# This is a RELEASE build signed with the default debug key — installable on
# any phone for testing, but NOT the key you'll publish to the Play Store
# with. See docs/BUILD-ANDROID.md for the Play Store signing setup.
#
# Requires two repository secrets (Settings -> Secrets and variables ->
# Actions): SUPABASE_URL and SUPABASE_ANON_KEY. Both are the public
# client-side values from your Supabase project's API settings — the anon
# key is safe to embed in a client app.

on:
  workflow_dispatch:
  # Auto-build on every push to the active development branch, so a fresh APK
  # artifact is produced from the latest code without needing a manual run
  # (and without accidentally re-running an old commit).
  push:
    branches:
      - claude/elder-care-platform-mx27jo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch dependencies
        working-directory: apps/family_elder_app
        run: flutter pub get

      - name: Build release APK
        working-directory: apps/family_elder_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # The app now has the pilot project's public URL + anon key as
          # compiled-in defaults (lib/core/env.dart), so a build works with no
          # secrets. If repo secrets ARE set they override the defaults via
          # --dart-define (use this to point a build at a different project).
          DEFINES=""
          if [ -n "$SUPABASE_URL" ]; then
            DEFINES="$DEFINES --dart-define=SUPABASE_URL=$SUPABASE_URL"
          fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            DEFINES="$DEFINES --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          fi
          # Gradle occasionally gets a transient 403 from Maven while
          # downloading dependencies. Retry the build a few times so a
          # network blip doesn't fail the whole run.
          n=0
          until [ "$n" -ge 3 ]; do
            flutter build apk --release $DEFINES && break
            n=$((n+1))
            echo "::warning::Build attempt $n failed (often a transient network error). Retrying in 20s…"
            sleep 20
          done
          if [ "$n" -ge 3 ]; then
            echo "::error::Build failed after 3 attempts."
            exit 1
          fi

      - name: Rename APK
        working-directory: apps/family_elder_app
        run: |
          mkdir -p ../../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../../dist/setu.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: setu-apk
          path: dist/setu.apk
          if-no-files-found: error
