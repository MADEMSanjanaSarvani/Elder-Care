name: Build APK

# Builds an installable Android APK for the single Setu app and uploads it as
# a downloadable artifact. Run it manually from the GitHub "Actions" tab
# (Build APK -> Run workflow) whenever you want a fresh APK to share.
#
# One app, three roles: at login the user picks family member / senior /
# caregiver, and the app shows the matching home. (The old separate caregiver
# app is superseded and no longer built.)
#
# RELEASE build. If the upload-keystore secrets below are set, it is signed
# with YOUR key (stable, known SHA-1 — the one to register with Firebase /
# Google Sign-In / Play Store, and uploadable to the Play Console). If they
# are absent, it falls back to the debug key so test builds still work.
#
# Optional repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY  — public client values; override the
#     compiled-in defaults to point a build at a different project.
#   ANDROID_KEYSTORE_BASE64          — `base64` of your upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD        — the keystore (store) password
#   ANDROID_KEY_ALIAS                — the key alias inside the keystore
#   ANDROID_KEY_PASSWORD             — the key password for that alias
# The four ANDROID_* secrets together enable stable release signing.

on:
  workflow_dispatch:
  # Auto-build on every push to the active development branch, so a fresh APK
  # artifact is produced from the latest code without needing a manual run
  # (and without accidentally re-running an old commit).
  push:
    branches:
      - claude/elder-care-platform-mx27jo

jobs:
  # Whole-app static audit: catches errors, warnings, unused code, missing
  # awaits and dead code across every Dart file. Runs in parallel with the
  # build so it never blocks producing an installable APK; a red result here
  # is the signal to fix real code issues.
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch dependencies
        working-directory: apps/family_elder_app
        run: flutter pub get
      - name: Analyze (errors + warnings fail; style infos don't)
        working-directory: apps/family_elder_app
        run: flutter analyze --no-fatal-infos

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch dependencies
        working-directory: apps/family_elder_app
        run: flutter pub get

      # If the upload-keystore secrets are configured, sign the release build
      # with your own key so the APK has a stable, known SHA-1 (matches
      # Firebase / Google Sign-In / Play Store). If they're absent, this step
      # is a no-op and the build falls back to the debug key as before.
      - name: Configure release signing
        working-directory: apps/family_elder_app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No upload keystore configured — building with the debug key."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks
          cat > key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS
          echo "Release signing configured from secrets."
          # Print the SHA-1/SHA-256 of the signing key so you can register it
          # in Firebase / Google Cloud without needing keytool locally.
          echo "===== SIGNING CERTIFICATE FINGERPRINTS (register these) ====="
          keytool -list -v \
            -keystore app/upload-keystore.jks \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null \
            | grep -E "SHA1:|SHA256:" || echo "Could not read fingerprints."
          echo "============================================================="

      - name: Build release APK
        working-directory: apps/family_elder_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # The app now has the pilot project's public URL + anon key as
          # compiled-in defaults (lib/core/env.dart), so a build works with no
          # secrets. If repo secrets ARE set they override the defaults via
          # --dart-define (use this to point a build at a different project).
          DEFINES=""
          if [ -n "$SUPABASE_URL" ]; then
            DEFINES="$DEFINES --dart-define=SUPABASE_URL=$SUPABASE_URL"
          fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            DEFINES="$DEFINES --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          fi
          # Gradle occasionally gets a transient 403 from Maven while
          # downloading dependencies. Retry the build a few times so a
          # network blip doesn't fail the whole run.
          n=0
          until [ "$n" -ge 3 ]; do
            flutter build apk --release $DEFINES && break
            n=$((n+1))
            echo "::warning::Build attempt $n failed (often a transient network error). Retrying in 20s…"
            sleep 20
          done
          if [ "$n" -ge 3 ]; then
            echo "::error::Build failed after 3 attempts."
            exit 1
          fi

      - name: Rename APK
        working-directory: apps/family_elder_app
        run: |
          mkdir -p ../../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../../dist/setu.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: setu-apk
          path: dist/setu.apk
          if-no-files-found: error
