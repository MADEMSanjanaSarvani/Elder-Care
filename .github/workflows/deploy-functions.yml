name: Deploy Backend (migrations + functions)

# Deploys the full backend to the live Supabase project:
#   1. `supabase db push` applies every file in supabase/migrations/ (so tables
#      like setu_memories that a screen depends on actually exist), and
#   2. `supabase functions deploy` ships every Edge Function.
#
# Required GitHub secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  — a personal access token (Supabase dashboard > Account > Access Tokens)
#   SUPABASE_PROJECT_REF   — the project ref (e.g. veumfexjpxqhxemjaaor)
#   SUPABASE_DB_PASSWORD   — the database password (Project Settings > Database)
#
# Run it now without a code change: Actions tab > this workflow > "Run workflow".
on:
  push:
    branches:
      - claude/elder-care-platform-mx27jo
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check functions/*/index.ts functions/_shared/*.ts
      - run: deno lint functions/
      - run: deno test --allow-net=api.openai.com,generativelanguage.googleapis.com functions/_shared/

  migrate:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Fail early if secrets are missing
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Missing one of SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF / SUPABASE_DB_PASSWORD. Add them in repo Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
      - name: Link to the live project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      # Apply only the migrations the remote hasn't seen yet.
      #
      # This was `db reset --linked`, which drops the whole database and
      # rebuilds it. That was right once: the remote had been half-built by
      # earlier partial deploys, `db push` collided on objects that already
      # existed, and the project held nothing but test data.
      #
      # It is wrong now, because it ran on EVERY push. Every commit destroyed
      # whatever was in the database. Survivable while the only rows were test
      # elders; catastrophic the moment a real family is onboarded, when an
      # unrelated code change would wipe their parent's medications, visit
      # history and consent record with no warning and no backup.
      #
      # The migration history is properly populated after the last successful
      # reset, so `db push` now applies cleanly and additively.
      #
      # Note: seed.sql no longer runs automatically. Seed data is a one-time
      # setup step, not something to re-apply on every deploy.
      - name: Apply new migrations
        run: supabase db push

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
