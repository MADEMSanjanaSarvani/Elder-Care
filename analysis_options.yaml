include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
    avoid_print: true
    # require_trailing_commas deliberately omitted: it fights `dart format`,
    # which doesn't add trailing commas on its own — enabling it just means
    # every `dart format` pass immediately reintroduces lint warnings.

analyzer:
  exclude:
    - "**/*.g.dart"
